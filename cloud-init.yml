  - path: /etc/apt/preferences.d/999-hold-kernel.pref
    content: |
      Package: linux-generic*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-headers*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-image*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules-extra*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-tools*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-virtual*
      Pin: release a=*
      Pin-Priority: -1
  - path: /etc/skel/.sudo_as_admin_successful
    content: ''
  - path: /etc/skel/.xsessionrc
    content: setxkbmap -layout jp -model jp106 -option ctrl:nocaps
  - path: /etc/skel/Brewfile
    content: |
      brew "task"
  - path: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: resolute
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
  - path: /etc/skel/Brewfile
    content: |
      # -*- mode: ruby -*-
      # vim: set ft=ruby :

      brew "task"
  - path: /usr/local/bin/install-homebrew
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      if [ ! -d "${HOME}/.linuxbrew" ]; then
        curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh | bash -
        echo >> "${HOME}/.bashrc"
        echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> "${HOME}/.bashrc"
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      fi
      brew bundle --file "${HOME}/Brewfile"
      brew update
      echo yes | task
  - path: /usr/local/bin/install-nvm
    permissions: '0755'
    content: |
      #!/bin/bash
      if [ -d "${HOME}/.nvm" ]; then
        echo "nvm is already installed at ${HOME}/.nvm"
        exit 0
      fi
      curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/HEAD/install.sh | bash -
      . "${HOME}/.nvm/nvm.sh"
      nvm install --lts
      nvm use --lts
  - path: /usr/local/sbin/update-docker-sources
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      eval "$(cat /etc/os-release)"
      V="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
      sed -i "s/^Suites: .\+/Suites: $V/g" /etc/apt/sources.list.d/docker.sources
      apt update
