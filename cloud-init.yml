#cloud-config
chpasswd:
  expire: false
  list: ubuntu:ubuntu
keyboard:
  layout: jp
  model: jp106
locale: ja_JP.UTF-8
package_reboot_if_required: true
package_update: true
package_upgrade: true
packages:
  - build-essential
  - ca-certificates
  - cmake
  - curl
  - fonts-ipafont-gothic
  - g++
  - gnupg
  - gh
  - gist
  - git
  - language-pack-ja
  - make
  - python3
  - python3-pip
  - x11-utils
  - x11-xkb-utils
  - xfce4
  - xfce4-terminal
  - xorgxrdp
  - xrdp
runcmd:
  - /usr/local/sbin/update-docker-sources
  - sudo apt-get install -y docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin
  - sudo -u ubuntu bash -ic /usr/local/bin/install-nvm
  - sudo -u ubuntu /usr/local/bin/install-homebrew
  - localectl set-locale LANG=ja_JP.UTF-8
  - localectl set-keymap jp
  - localectl set-x11-keymap jp
  - apt-get autoremove -y
  - apt-get clean
timezone: Asia/Tokyo
users:
  - name: ubuntu
    groups: docker
    append_groups: true
write_files:
  - path: /etc/apt/apt.conf.d/99no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
