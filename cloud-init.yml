#cloud-config
keyboard:
  layout: jp
  model: jp106
locale: ja_JP.UTF-8
package_reboot_if_required: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - language-pack-ja
timezone: Asia/Tokyo
write_files:
  - path: /etc/apt/preferences.d/999-hold-kernel.pref
    content: |
      Package: linux-generic*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-headers*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-image*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules-extra*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-tools*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-virtual*
      Pin: release a=*
      Pin-Priority: -1
  - path: /etc/skel/.local/src/automata/.gitkeep
    content: ''
  - path: /etc/skel/.sudo_as_admin_successful
    content: ''
  - path: /usr/local/bin/automata-setup
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      if [ ! -f "${HOME}/.local/src/automata.tar" ]
      then
        echo "Aborted: No automata.tar found in ${HOME}/.local/src/"
        exit 1
      fi
      tar -xvf "${HOME}/.local/src/automata.tar" -C "${HOME}/.local/src/automata"
      rm "${HOME}/.local/src/automata.tar"
      "${HOME}/.local/src/automata/setup"
