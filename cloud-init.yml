#cloud-config
keyboard:
  layout: jp
  model: jp106
locale: ja_JP.UTF-8
package_reboot_if_required: true
package_update: true
package_upgrade: false
packages:
  - language-pack-ja
  - nodejs
runcmd:
  - apt-get -y autoremove
  - apt-get clean
timezone: Asia/Tokyo
write_files:
  - path: /etc/apt/apt.conf.d/99no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
  - path: /etc/apt/preferences.d/999-hold-kernel.pref
    content: |
      Package: linux-generic*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-headers*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-image*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules-extra*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-tools*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-virtual*
      Pin: release a=*
      Pin-Priority: -1
  - path: /etc/skel/.sudo_as_admin_successful
    content: ''
