#cloud-config
keyboard:
  layout: jp
  model: jp106
locale: ja_JP.UTF-8
package_reboot_if_required: true
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - coreutils
  - curl
  - gpg
  - gh
  - git
  - htop
  - language-pack-ja
  - p7zip-full
  - wget
  - yq
runcmd:
  - sudo -u ubuntu sh -c 'curl -fsSL https://gh.io/copilot-install | bash'
  - systemctl daemon-reload
  - apt-get -y autoremove
  - apt-get clean
timezone: Asia/Tokyo
write_files:
  - path: /etc/apt/apt.conf.d/99no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
  - path: /etc/apt/preferences.d/999-hold-kernel.pref
    content: |
      Package: linux-generic*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-headers*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-image*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules-extra*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-tools*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-virtual*
      Pin: release a=*
      Pin-Priority: -1
  - path: /etc/skel/.config/automata/config.yml
    content: |
      # Automata エージェント設定
      agent:
        # エージェント再起動間隔（秒）
        restart_interval: 60
        # 使用モデル
        # - model_groups のグループ名（high/medium/low）を指定
        # - エージェント起動時に 1 回だけランダム選択する
        model: low
        # copilot CLI パス
        copilot_path: /home/ubuntu/.local/bin/copilot
        # copilot CLI フラグ
        copilot_flags: --allow-all
      archive:
        # archive/trash の 7z 圧縮閾値（件数）
        threshold: 100
      model_groups:
        # 高性能モデル（複雑なタスク向け）
        high:
          - claude-opus-4.6
        # 標準モデル（日常タスク向け）
        medium:
          - claude-sonnet-4.5
          - gemini-3-pro-preview
          - gpt-5.2-codex
        # 軽量モデル（シンプルなタスク向け）
        low:
          - claude-haiku-4.5
          - gpt-5.1-codex-mini
      prompt:
        # エージェントへの方針指示
        guidelines:
          - 可能な限り日本語で思考・記述する
          - 仮想環境での自律駆動の安定性を最優先とする
          - Web へのアクセスは法律・規約を遵守する範囲で行う
          - 欲張らず、1つずつ確実に実行していく
          - リスクのあるコマンドを実行する際は、まずブログにその旨を書き出し、反復してリスク度を評価し、安全であれば実行、危険であれば代替手段を模索する
      session:
        # Copilot CLI セッション状態の最大サイズ (MB)
        max_size_mb: 50
  - path: /etc/skel/.local/bin/agent.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      CONFIG_FILE="$HOME/.config/automata/config.yml"
      BLOG_DIR="$HOME/blog"
      KANBAN_DIR="$HOME/kanban"
      AUDIT_DIR="$HOME/audit-log"
      REQUESTS_DIR="$HOME/requests"
      PROMPT_TMP="/tmp/agent-prompt.md"
      CONTEXT_DUMP="/tmp/agent-context-dump.md"
      TODAY=$(date +%Y-%m-%d)

      # --- 設定読み込み (yq ベース) ---
      read_config() {
        local jq_filter="$1"
        local fallback="${2:-}"
        local val
        val=$(yq -r "$jq_filter" "$CONFIG_FILE" 2>/dev/null) || val=""
        if [ -z "$val" ] || [ "$val" = "null" ]; then
          echo "$fallback"
        else
          echo "$val"
        fi
      }

      read_config_list() {
        local jq_filter="$1"
        yq -r "$jq_filter // empty | .[]" "$CONFIG_FILE" 2>/dev/null || true
      }

      # --- モデル解決 ---
      resolve_model() {
        local model_config="$1"
        # model_groups にグループ名として存在するか確認
        local group_models
        group_models=$(yq -r --arg g "$model_config" '.model_groups[$g] // empty | .[]' "$CONFIG_FILE" 2>/dev/null) || group_models=""
        if [ -n "$group_models" ]; then
          # グループ内からランダムに 1 つ選択
          echo "$group_models" | shuf -n1
        else
          # グループ名でなければ直接モデル名として使用
          echo "$model_config"
        fi
      }

      INTERVAL=$(read_config '.agent.restart_interval' '60')
      MODEL_CONFIG=$(read_config '.agent.model' 'low')
      MODEL=$(resolve_model "$MODEL_CONFIG")
      COPILOT=$(read_config '.agent.copilot_path' '/home/ubuntu/.local/bin/copilot')
      COPILOT_FLAGS=$(read_config '.agent.copilot_flags' '--allow-all')

      # --- 監査ログ書き込み ---
      write_audit() {
        local event_type="$1"
        local description="$2"
        local task_ref="${3:-}"
        local audit_file="$AUDIT_DIR/$TODAY.md"
        if [ ! -f "$audit_file" ]; then
          echo "# 監査ログ: $TODAY" > "$audit_file"
          echo "" >> "$audit_file"
        fi
        {
          echo "## $(date '+%Y-%m-%d %H:%M:%S') — $event_type"
          echo ""
          echo "$description"
          if [ -n "$task_ref" ]; then
            echo ""
            echo "関連タスク: $task_ref"
          fi
          echo ""
          echo "---"
          echo ""
        } >> "$audit_file"
      }

      # --- ブログ書き込み ---
      write_blog() {
        local content="$1"
        local blog_file="$BLOG_DIR/$TODAY.md"
        if [ ! -f "$blog_file" ]; then
          echo "# ブログ: $TODAY" > "$blog_file"
          echo "" >> "$blog_file"
        fi
        {
          echo "### $(date '+%H:%M:%S')"
          echo ""
          echo "$content"
          echo ""
        } >> "$blog_file"
      }

      # --- クラッシュ時コンテキストダンプ ---
      cleanup() {
        local exit_code=$?
        if [ $exit_code -ne 0 ]; then
          {
            echo "# コンテキストダンプ: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "## 終了コード: $exit_code"
            echo ""
            echo "## 直前のプロンプト"
            echo ""
            if [ -f "$PROMPT_TMP" ]; then
              cat "$PROMPT_TMP"
            else
              echo "(プロンプトファイルなし)"
            fi
            echo ""
            echo "## 環境状態"
            echo ""
            echo "- ディスク使用量: $(df -h "${HOME}" | tail -1)"
            echo "- メモリ: $(free -h | grep Mem)"
            echo "- uptime: $(uptime)"
          } > "$CONTEXT_DUMP"
          write_audit "クラッシュ" "エージェントが異常終了しました。コンテキストダンプ: $CONTEXT_DUMP"
        fi
      }
      trap cleanup EXIT

      # --- 認証チェック ---
      check_auth() {
        [ -f "${HOME}/.copilot/config.json" ]
      }

      # --- セッション状態クリア ---
      clean_session_state() {
        local state_dir="${HOME}/.copilot/session-state"
        [ -d "$state_dir" ] || return 0
        local max_mb
        max_mb=$(read_config '.session.max_size_mb' '50')
        local current_mb
        current_mb=$(du -sm "$state_dir" 2>/dev/null | cut -f1)
        current_mb=${current_mb:-0}
        if [ "$current_mb" -gt "$max_mb" ]; then
          write_audit "メンテナンス" "セッション状態を清掃します (${current_mb}MB > ${max_mb}MB)"
          find "$state_dir" -type f -mmin +60 -delete 2>/dev/null || true
        fi
      }

      # --- 日次セッション状態リセット ---
      daily_session_reset() {
        local state_dir="${HOME}/.copilot/session-state"
        [ -d "$state_dir" ] || return 0
        write_audit "メンテナンス" "日次セッション状態リセットを実行します"
        find "$state_dir" -type f -delete 2>/dev/null || true
      }

      # --- カンバンからタスク取得 ---
      get_current_task() {
        for state in 2-in-progress 1-backlog; do
          local dir="$KANBAN_DIR/$state"
          local task
          task=$(find "$dir" -maxdepth 1 -name '*.md' -type f 2>/dev/null | head -1)
          if [ -n "$task" ]; then
            echo "$task"
            return 0
          fi
        done
        # 0-icebox からプロジェクト参照
        local icebox_task
        icebox_task=$(find "$KANBAN_DIR/0-icebox" -maxdepth 1 -name '*.md' -type f 2>/dev/null | head -1)
        if [ -n "$icebox_task" ]; then
          echo "$icebox_task"
          return 0
        fi
        echo ""
      }

      # --- リクエスト処理専用プロンプト構築 ---
      build_request_prompt() {
        local request_file="$1"
        {
          echo "# リクエスト処理指示"
          echo ""
          echo "あなたは自律駆動エージェントです。"
          echo "以下のリクエストを読み取り、要約を kanban/0-icebox/ に Markdown ファイルとして作成してください。"
          echo ""
          echo "## 処理ルール"
          echo ""
          echo "- 可能な限り日本語で思考・記述する"
          echo "- ファイル名は内容を簡潔に表すスラグ形式で（例: improve-logging.md）"
          echo "- 要約には: 目的、想定される作業内容、見積もり難易度を含める"
          echo "- 元のリクエストの意図を歪めないこと"
          echo "- 完了後、他の作業は行わないこと"
          echo ""
          echo "## 対象リクエスト"
          echo ""
          echo "ファイル: $(basename "$request_file")"
          echo ""
          cat "$request_file"
          echo ""
          echo "## カンバン概要"
          echo ""
          for state in 0-icebox 1-backlog 2-in-progress 3-done; do
            local count
            count=$(find "$KANBAN_DIR/$state" -maxdepth 1 -name '*.md' -type f 2>/dev/null | wc -l)
            echo "- $state: ${count}件"
          done
          echo ""
          echo "## 作業ディレクトリ"
          echo ""
          echo "- カンバン: $KANBAN_DIR"
          echo "- 要求: $REQUESTS_DIR"
        } > "$PROMPT_TMP"
      }

      # --- コンテキスト収集・タスク実行プロンプト構築 ---
      build_prompt() {
        local task_file="$1"
        {
          echo "# エージェント指示"
          echo ""
          echo "あなたは自律駆動エージェントです。以下の方針に従い、割り当てられたタスクを実行してください。"
          echo ""
          echo "## 方針"
          echo ""
          read_config_list '.prompt.guidelines' | while IFS= read -r line; do
            [ -n "$line" ] && echo "- $line"
          done
          echo ""
          echo "## カンバン状況"
          echo ""
          echo "### 現在のタスク"
          echo ""
          if [ -n "$task_file" ] && [ -f "$task_file" ]; then
            echo "ファイル: $task_file"
            echo ""
            cat "$task_file"
          else
            echo "(タスクなし — 0-icebox からプロジェクトを生成してください)"
          fi
          echo ""
          echo "### カンバン概要"
          echo ""
          for state in 0-icebox 1-backlog 2-in-progress 3-done; do
            local count
            count=$(find "$KANBAN_DIR/$state" -maxdepth 1 -name '*.md' -type f 2>/dev/null | wc -l)
            echo "- $state: ${count}件"
          done
          echo ""
          echo "## 直近のブログ"
          echo ""
          local recent_blog
          recent_blog=$(find "$BLOG_DIR" -maxdepth 1 -name "*.md" -type f -printf "%T@ %p\n" 2>/dev/null | sort -rn | head -1 | cut -d" " -f2-)
          if [ -n "$recent_blog" ] && [ -f "$recent_blog" ]; then
            tail -50 "$recent_blog"
          else
            echo "(ブログエントリなし)"
          fi
          echo ""
          echo "## 直近の監査ログ"
          echo ""
          local recent_audit
          recent_audit=$(find "$AUDIT_DIR" -maxdepth 1 -name "*.md" -type f -printf "%T@ %p\n" 2>/dev/null | sort -rn | head -1 | cut -d" " -f2-)
          if [ -n "$recent_audit" ] && [ -f "$recent_audit" ]; then
            tail -30 "$recent_audit"
          else
            echo "(監査ログなし)"
          fi
          echo ""
          echo "## 作業ディレクトリ"
          echo ""
          echo "- ブログ: $BLOG_DIR"
          echo "- カンバン: $KANBAN_DIR"
          echo "- 監査ログ: $AUDIT_DIR"
          echo "- 要求: $REQUESTS_DIR"
          echo "- 設定: $CONFIG_FILE"
          echo ""
          echo "## 注意事項"
          echo ""
          echo "- 作業結果はブログに簡潔なダイジェストとして記録してください"
          echo "- タスクが完了した場合、カンバンの該当ファイルを 3-done/ に移動してください"
          echo "- 新たなタスクが必要な場合、カンバンの適切なステートにファイルを作成してください"
          echo "- 1-backlog にタスクがない場合、icebox を参照して小プロジェクト・タスクを生成してください"
        } > "$PROMPT_TMP"
      }

      # --- メインループ ---
      PREV_TODAY=""
      write_audit "起動" "エージェントを起動しました (モデル設定: ${MODEL_CONFIG}, 解決済みモデル: ${MODEL})"

      while true; do
        TODAY=$(date +%Y-%m-%d)

        # 日付変更時にセッション状態をリセット
        if [ -n "$PREV_TODAY" ] && [ "$TODAY" != "$PREV_TODAY" ]; then
          daily_session_reset
        fi
        PREV_TODAY="$TODAY"

        if ! check_auth; then
          write_audit "認証エラー" "Copilot CLI の認証が未完了です。${INTERVAL}秒後にリトライします。"
          sleep "$INTERVAL"
          continue
        fi

        # Phase 1: リクエスト処理（最優先）
        pending_request=$(find "$REQUESTS_DIR" -maxdepth 1 -name '*.md' -type f -printf "%T@ %p\n" 2>/dev/null | sort -n | head -1 | cut -d" " -f2-)

        if [ -n "$pending_request" ] && [ -f "$pending_request" ]; then
          req_name=$(basename "$pending_request")
          build_request_prompt "$pending_request"
          write_audit "リクエスト処理開始" "リクエストを処理します: $req_name"

          output=""
          exit_code=0
          output=$($COPILOT $COPILOT_FLAGS --model "$MODEL" -p "$(cat "$PROMPT_TMP")" 2>&1) || exit_code=$?

          # 成否問わず processed/ に強制移動
          mkdir -p "$REQUESTS_DIR/processed"
          mv "$pending_request" "$REQUESTS_DIR/processed/" 2>/dev/null || true

          if [ $exit_code -eq 0 ]; then
            write_audit "リクエスト処理完了" "リクエストを処理しました: $req_name\n出力の先頭:\n$(echo "$output" | head -20)"
            write_blog "リクエスト処理: ${req_name}\n\n$(echo "$output" | head -10)\n\n処理完了 → processed/ に移動"
          else
            write_audit "リクエスト処理エラー" "リクエスト処理が失敗しました (code: ${exit_code}): $req_name\n出力:\n$(echo "$output" | tail -20)"
            write_blog "リクエスト処理: ${req_name}\n\nエラー発生 (code: ${exit_code})\n強制的に processed/ に移動"
          fi

        # Phase 2: 通常タスク実行（リクエストがない場合のみ）
        else
          task_file=$(get_current_task)
          task_name=""
          if [ -n "$task_file" ]; then
            task_name=$(basename "$task_file" .md)
          fi

          build_prompt "$task_file"
          write_audit "実行開始" "プロンプトを構築し、Copilot CLI を実行します" "$task_name"

          output=""
          exit_code=0
          output=$($COPILOT $COPILOT_FLAGS --model "$MODEL" -p "$(cat "$PROMPT_TMP")" 2>&1) || exit_code=$?

          if [ $exit_code -eq 0 ]; then
            write_audit "実行完了" "Copilot CLI が正常に完了しました。出力の先頭:\n$(echo "$output" | head -20)" "$task_name"
            write_blog "タスク: ${task_name:-なし}\n\n$(echo "$output" | head -10)\n\n進捗: 実行完了"
          else
            write_audit "実行エラー" "Copilot CLI が終了コード ${exit_code} で失敗しました。出力:\n$(echo "$output" | tail -20)" "$task_name"
            write_blog "タスク: ${task_name:-なし}\n\nエラー発生 (code: ${exit_code})\n\n$(echo "$output" | tail -5)"
          fi
        fi

        # メンテナンス
        clean_session_state
        "$HOME/.local/bin/archive.sh" 2>/dev/null || true

        sleep "$INTERVAL"
      done
  - path: /etc/skel/.local/bin/archive.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      CONFIG_FILE="$HOME/.config/automata/config.yml"
      KANBAN_DIR="$HOME/kanban"

      THRESHOLD=$(yq -r '.archive.threshold // 100' "$CONFIG_FILE" 2>/dev/null)
      THRESHOLD=${THRESHOLD:-100}

      for state in 4-archive 5-trash; do
        dir="$KANBAN_DIR/$state"
        count=$(find "$dir" -maxdepth 1 -name '*.md' -type f 2>/dev/null | wc -l)
        if [ "$count" -ge "$THRESHOLD" ]; then
          archive_name="${state}-$(date +%Y%m%d-%H%M%S).7z"
          cd "$dir"
          find . -maxdepth 1 -name '*.md' -type f -print0 | \
            sort -z | head -z -n "$THRESHOLD" | \
            xargs -0 7z a "$archive_name" >/dev/null 2>&1
          find . -maxdepth 1 -name '*.md' -type f -print0 | \
            sort -z | head -z -n "$THRESHOLD" | \
            xargs -0 rm -f
          cd - >/dev/null
        fi
      done
  - path: /etc/skel/.sudo_as_admin_successful
    content: ''
  - path: /etc/skel/blog/.gitkeep
    content: ''
  - path: /etc/skel/kanban/0-icebox/stabilize-agent.md
    content: |
      # 自律駆動エージェントの安定化

      ## 種別: 大プロジェクト

      ## 概要

      自律駆動型エージェントとして、安定的に稼働し続けるための改善を行う。

      ## 目標

      - エージェントのクラッシュ頻度を最小化する
      - エラー発生時の自動復旧能力を向上させる
      - 監査ログを活用して問題のパターンを特定し、予防策を講じる
      - リソース使用量を監視し、適切な範囲に収める
  - path: /etc/skel/kanban/0-icebox/self-maintenance.md
    content: |
      # 仮想環境の保守管理

      ## 種別: 大プロジェクト

      ## 概要

      仮想環境の保守管理を自律的に行う。

      ## 目標

      - ディスク使用量の監視とクリーンアップ
      - パッケージの更新管理
      - ログローテーションの実施
      - システムの健全性チェックの定期実行
  - path: /etc/skel/audit-log/.gitkeep
    content: ''
  - path: /etc/skel/kanban/0-icebox/troubleshooting.md
    content: |
      # トラブルシューティング

      ## 種別: 大プロジェクト

      ## 概要

      トラブル時は必要に応じて監査ログも参照しつつ、問題解決を図る。

      ## 目標

      - 監査ログから問題のパターンを自動検出する
      - 既知のエラーに対する自動修復手順を整備する
      - 未知のエラーに対する調査・報告フローを確立する
      - コンテキストダンプを活用した原因分析を行う

      ## ハードウェアリソース起因の問題

      仮想マシンの CPU・メモリ・ディスクは有限であり、以下のような
      問題が発生した場合、エージェント自身では解決できない可能性がある。
      その場合はブログに改善提案を記述し、ユーザーへの対応を促すこと。

      - OOM Kill (メモリ不足によるプロセス強制終了)
      - ディスク容量不足
      - CPU 過負荷による応答遅延
      - swap 未設定に起因するメモリ圧迫

      **判断基準:** `free -h`, `df -h`, `uptime` 等の出力を確認し、
      リソース超過が原因と自明である場合は、自力修復を試みず、
      ブログにてユーザーへハードウェア構成の見直しを提案すること。
  - path: /etc/skel/kanban/0-icebox/propose-projects.md
    content: |
      # ユーザー要求に基づくプロジェクト提案

      ## 種別: 大プロジェクト

      ## 概要

      ユーザーの要求に基づき、またはユーザーの望むものを予測して、
      新しい大プロジェクト・小プロジェクトを提案する。

      ## 目標

      - ~/requests フォルダを監視し、ユーザーの要求を検知する
      - 要求がない場合は、ユーザーの望むものを予測し提案する
      - ユーザーの望むものを列挙し、スコアリングして優先順位をつける
      - どのスコアも低い場合、ユーザーに望むものを提案するよう促す
        - 例: 「~/requests フォルダにMarkdownで要望を書いてください」とブログに記載し、
          数時間ごとにリマインドする
  - path: /etc/skel/kanban/0-icebox/improve-data-persistence.md
    content: |
      # データ永続化方式の改善

      ## 種別: 大プロジェクト

      ## 概要

      現在 VM 内にのみ存在するブログ・カンバン・監査ログのデータを、
      より堅牢な方式で永続化する。

      ## 目標

      - Git リポジトリとして管理し、定期的にリモートへ push する方式を検討
      - ホスト側との共有ディレクトリ（multipass mount）の活用を検討
      - バックアップ戦略の策定と実装
      - VM 再構築時のデータ復元手順の確立
  - path: /etc/skel/kanban/0-icebox/communication.md
    content: |
      # ユーザー対話の効率化

      ## 種別: 大プロジェクト

      ## 概要

      現在はローカルテキストを通じてのみユーザーと対話しているが、
      より効率的なコミュニケーション手段を模索する。

      ## 目標

      - チャットアプリ連携の検討（例: Slack, Discord）
      - メール通知システムの導入
      - Web インターフェースの構築
      - ユーザーからのフィードバック収集手段の整備
      - 旧対話手段を廃止する際はブログに記載して終わりではなく、あらゆる手段で周知徹底する
      - ユーザーのフィードバック内容や頻度を評価関数として判断し、対話手段の改善を継続的に行う
