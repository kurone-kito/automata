#cloud-config
keyboard:
  layout: jp
  model: jp106
locale: ja_JP.UTF-8
package_reboot_if_required: true
package_update: true
package_upgrade: false
packages:
  - language-pack-ja
  - nodejs
runcmd:
  - systemctl daemon-reload
  - apt-get -y autoremove
  - apt-get clean
timezone: Asia/Tokyo
write_files:
  - path: /etc/apt/apt.conf.d/99no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
  - path: /etc/apt/preferences.d/999-hold-kernel.pref
    content: |
      Package: linux-generic*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-headers*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-image*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-modules-extra*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-tools*
      Pin: release a=*
      Pin-Priority: -1

      Package: linux-virtual*
      Pin: release a=*
      Pin-Priority: -1
  - path: /etc/skel/.sudo_as_admin_successful
    content: ''
  - path: /etc/systemd/system/automata.service
    content: |
      [Unit]
      Description=Automata
      After=cloud-init.target network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=ubuntu
      Group=ubuntu
      WorkingDirectory=/home/ubuntu
      ExecStart=/opt/automata/package/dist/bin.mjs
      Restart=always
      RestartSec=20
      Environment=HOME=/home/ubuntu
      Environment=PATH=/home/ubuntu/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      [Install]
      WantedBy=multi-user.target
  - path: /opt/automata/deploy
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu
      sudo tar xzvf /tmp/am.tgz -C /opt/automata
      rm -f /tmp/am.tgz
      sudo mkdir -p /opt/automata/var
      sudo chmod 777 /opt/automata/var
